<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>40% Scaled View</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f0f0f0; overflow: hidden; }
  .scaler { width: 250%; height: 250%; transform: scale(0.4); transform-origin: 0 0; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <div class="scaler"><iframe src="../index.html"></iframe></div>
</body>
</html>
